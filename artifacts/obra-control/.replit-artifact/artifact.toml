kind = "web"
previewPath = "/"
title = "ObraControl"
description = "Plataforma modular para constructoras de Costa Rica que controla la rentabilidad por obra, centraliza incidencias entre campo y oficina, y gestiona contratos, avances y pagos de subcontratistas."
version = "1.0.0"
id = "artifacts/obra-control"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24494

[services.development]
run = "pnpm --filter @workspace/obra-control run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/obra-control", "run", "build" ]
serve = "static"
publicDir = "artifacts/obra-control/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24494"
BASE_PATH = "/"
